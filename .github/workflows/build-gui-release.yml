name: Build and Release GUI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: markitdown-gui-windows.exe
            built_file: markitdown-gui.exe
          - os: ubuntu-22.04
            artifact_name: markitdown-gui-linux
            built_file: markitdown-gui
          - os: macos-latest
            artifact_name: markitdown-gui-macos
            built_file: markitdown-gui
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e 'packages/markitdown[all]'
          pip install pyinstaller

      - name: Build executable
        run: pyinstaller markitdown-gui.spec

      - name: Rename artifact
        shell: bash
        run: mv "dist/${{ matrix.built_file }}" "dist/${{ matrix.artifact_name }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
